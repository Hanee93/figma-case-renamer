<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 12px; font: 11px/1.4 Inter, system-ui, sans-serif;
    color: var(--figma-color-text); background: var(--figma-color-bg);
  }
  h2 { font-size: 11px; margin: 12px 0 6px; color: var(--figma-color-text-secondary); text-transform: uppercase; letter-spacing: .04em; display: flex; justify-content: space-between; }
  h2 span { text-transform: none; letter-spacing: 0; font-weight: normal; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .styles label {
    display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 4px;
    border: 1px solid var(--figma-color-border); cursor: pointer;
  }
  .styles label:has(input:checked) { border-color: var(--figma-color-border-brand-strong); background: var(--figma-color-bg-brand-tertiary); }
  .styles input { display: none; }
  .styles b { font-family: ui-monospace, monospace; }
  .styles small { color: var(--figma-color-text-secondary); font-family: ui-monospace, monospace; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  select { flex: 1; font: inherit; padding: 3px 4px; background: var(--figma-color-bg-secondary); color: inherit; border: 1px solid var(--figma-color-border); border-radius: 3px; }
  .box { border: 1px solid var(--figma-color-border); border-radius: 4px; overflow: auto; }
  #dict { max-height: 150px; }
  #dict div { display: grid; grid-template-columns: 1fr 1.4fr 32px; gap: 6px; align-items: center; padding: 3px 6px; border-bottom: 1px solid var(--figma-color-border); }
  #dict div:last-child { border-bottom: 0; }
  #dict input {
    font: inherit; padding: 3px 6px; border: 1px solid var(--figma-color-border); border-radius: 3px;
    background: var(--figma-color-bg-secondary); color: inherit; min-width: 0;
  }
  #dict input:focus { outline: 1px solid var(--figma-color-border-brand-strong); }
  #dict .count { color: var(--figma-color-text-secondary); text-align: right; }
  #preview { max-height: 170px; font-family: ui-monospace, monospace; font-size: 10px; }
  #preview div { display: grid; grid-template-columns: 1fr 12px 1fr; gap: 6px; padding: 3px 6px; border-bottom: 1px solid var(--figma-color-border); }
  #preview div:last-child { border-bottom: 0; }
  #preview .same { opacity: .5; }
  #preview .skip { opacity: .5; font-style: italic; }
  #preview span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footer { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .footer .count { flex: 1; color: var(--figma-color-text-secondary); }
  button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: inherit; cursor: pointer;
  }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button:disabled { opacity: .4; cursor: default; }
  .empty { padding: 14px; text-align: center; color: var(--figma-color-text-secondary); }
</style>
</head>
<body>
  <h2>케이스</h2>
  <div class="styles" id="styles"></div>

  <h2>한글 단어 → 영어 <span id="dictHint"></span></h2>
  <div class="box" id="dict"><div class="empty">선택한 레이어에 한글이 없어요</div></div>

  <h2>끝 숫자 정리</h2>
  <div class="row"><select id="numbers"></select></div>
  <label class="row"><input type="checkbox" id="defaultOnly" checked /> Figma 기본 이름(Frame, Group, Rectangle…)에만</label>

  <h2>옵션</h2>
  <label class="row"><input type="checkbox" id="recursive" /> 자식 레이어까지 적용</label>
  <label class="row"><input type="checkbox" id="slash" checked /> "/" 그룹 구분 유지</label>

  <h2>미리보기</h2>
  <div class="box" id="preview"><div class="empty">레이어를 선택하세요</div></div>

  <div class="footer">
    <span class="count" id="count"></span>
    <button id="cancel">닫기</button>
    <button id="apply" class="primary" disabled>적용</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  let rows = [];
  let hangulWords = [];
  let dictionary = {};   // 저장된 것 + 이번에 입력한 것

  function opts() {
    return {
      style: document.querySelector('input[name=style]:checked')?.value ?? 'camel',
      dictionary,
      preserveSlash: $('slash').checked,
      numbers: $('numbers').value,
      defaultNamesOnly: $('defaultOnly').checked,
    };
  }
  const recursive = () => $('recursive').checked;
  function requestPreview() {
    parent.postMessage({ pluginMessage: { type: 'preview', opts: opts(), recursive: recursive() } }, '*');
  }

  function renderStyles(styles) {
    $('styles').innerHTML = styles.map((s, i) => `
      <label>
        <input type="radio" name="style" value="${s.value}" ${i === 0 ? 'checked' : ''} />
        <b>${s.label}</b><small>${s.example}</small>
      </label>`).join('');
    $('styles').addEventListener('change', requestPreview);
  }

  /** 단어 목록은 선택이 바뀔 때만 다시 그린다. 입력 중에 포커스를 잃지 않게 하기 위함. */
  let renderedWords = '';
  function renderDict() {
    const key = hangulWords.map((w) => w.word).join('\n');
    const filled = hangulWords.filter((w) => dictionary[w.word]?.trim()).length;
    $('dictHint').textContent = hangulWords.length ? `${filled}/${hangulWords.length} 입력됨` : '';
    if (key === renderedWords) return;
    renderedWords = key;

    if (hangulWords.length === 0) {
      $('dict').innerHTML = '<div class="empty">선택한 레이어에 한글이 없어요</div>';
      return;
    }
    $('dict').innerHTML = hangulWords.map((w) => `
      <div>
        <span>${esc(w.word)}</span>
        <input data-word="${esc(w.word)}" value="${esc(dictionary[w.word] ?? '')}" placeholder="영어 입력" spellcheck="false" />
        <span class="count">×${w.count}</span>
      </div>`).join('');
  }

  $('dict').addEventListener('input', (e) => {
    const input = e.target;
    if (!input.dataset?.word) return;
    dictionary = { ...dictionary, [input.dataset.word]: input.value };
    requestPreview();
  });
  // Enter 로 다음 칸으로 이동
  $('dict').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const inputs = [...$('dict').querySelectorAll('input')];
    const i = inputs.indexOf(e.target);
    if (i >= 0 && i + 1 < inputs.length) inputs[i + 1].focus();
  });

  function renderPreview() {
    const box = $('preview');
    if (rows.length === 0) {
      box.innerHTML = '<div class="empty">레이어를 선택하세요</div>';
      $('count').textContent = '';
      $('apply').disabled = true;
      return;
    }
    const changed = rows.filter((r) => !r.skipped && r.before !== r.after).length;
    const MAX_ROWS = 300;
    const shown = rows.slice(0, MAX_ROWS);
    const more = rows.length - shown.length;
    box.innerHTML = shown.map((r) => {
      const cls = r.skipped ? 'skip' : r.before === r.after ? 'same' : '';
      const after = r.skipped ? `(건너뜀: ${r.skipped})` : r.after;
      return `<div class="${cls}"><span title="${esc(r.before)}">${esc(r.before)}</span><span>→</span><span title="${esc(after)}">${esc(after)}</span></div>`;
    }).join('') + (more > 0 ? `<div class="empty">… 외 ${more}개 (적용 시 모두 포함)</div>` : '');
    $('count').textContent = `${rows.length}개 중 ${changed}개 변경`;
    $('apply').disabled = changed === 0;
  }

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'init') {
      dictionary = msg.dictionary ?? {};
      renderStyles(msg.styles);
      $('numbers').innerHTML = msg.numberModes.map((m) => `<option value="${m.value}">${m.label} (${m.example})</option>`).join('');
      requestPreview();
    }
    if (msg.type === 'preview') {
      rows = msg.rows;
      hangulWords = msg.hangulWords;
      renderDict();
      renderPreview();
    }
  };

  ['recursive', 'slash', 'numbers', 'defaultOnly'].forEach((id) => $(id).addEventListener('change', requestPreview));
  $('apply').onclick = () => parent.postMessage({ pluginMessage: { type: 'apply', opts: opts(), recursive: recursive() } }, '*');
  $('cancel').onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
</script>
</body>
</html>
